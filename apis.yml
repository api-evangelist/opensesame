aid: opensesame
name: Opensesame
description: 'OpenSesame is an online learning course marketplace founded in 2002 and
  headquartered in Portland, Oregon. It offers 60,000+ pre-vetted training courses in
  70+ languages spanning compliance, business skills, safety, technology, leadership,
  and industry-specific topics, and delivers them into an organization''s existing
  learning management system through a patented one-click curation integration with
  automatic daily metadata sync and xAPI progress reporting. OpenSesame is a portfolio
  company of Partech and maintains a public trust center with SOC 2 Type 2, ISO/IEC
  27001, ISO/IEC 27701, and GDPR posture.'
